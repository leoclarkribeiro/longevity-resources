project_id = "longevity"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
# Must match your deployed app URL in Supabase Dashboard (Auth → URL Configuration).
# For local dev, localhost is fine. Set NEXT_PUBLIC_SITE_URL in production.
site_url = "https://longevity-resources.xyz"
additional_redirect_urls = [
  "http://localhost:3000",
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/reset-password",
  "http://127.0.0.1:3000",
  "http://127.0.0.1:3000/auth/callback",
  "http://127.0.0.1:3000/auth/reset-password",
  "https://longevity-resources.vercel.app",
  "https://longevity-resources.vercel.app/auth/callback",
  "https://longevity-resources.vercel.app/auth/reset-password",
  "https://longevity-resources.xyz",
  "https://longevity-resources.xyz/auth/callback",
  "https://longevity-resources.xyz/auth/reset-password",
]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
# No confirmation email — users can sign in immediately after registering.
enable_confirmations = false
